<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #challenge-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          bottom: 108px;
          padding: 26px 32px 28px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #challenge-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #2459e8;
        }
        #challenge-title {
          margin-top: 10px;
          font-size: 36px;
          font-weight: 700;
          line-height: 1.22;
          letter-spacing: -0.01em;
        }
      </style>

      <div id="root" data-composition-id="challenge" data-width="1080" data-height="1080">
        <div id="challenge-panel">
          <div id="challenge-kicker">The challenge</div>
          <div id="challenge-title">Turning existing industrial knowledge into training every employee can use</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#challenge-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
        tl.fromTo("#challenge-title", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.15);
        tl.to("#challenge-panel", { opacity: 0, y: 12, duration: 0.4, ease: "power1.in" }, 5.2);
        window.__timelines["challenge"] = tl;
      </script>
    </template>
  </body>
</html>
