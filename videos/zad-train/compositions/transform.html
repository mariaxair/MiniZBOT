<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #transform-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          bottom: 108px;
          padding: 26px 32px 28px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #transform-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #17603e;
        }
        #transform-row {
          display: flex;
          gap: 14px;
          margin-top: 16px;
        }
        .transform-chip {
          flex: 1 1 0;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 78px;
          padding: 0 14px;
          border-radius: 14px;
          background: #f3f5f9;
        }
        .transform-icon {
          flex: 0 0 44px;
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: #e3efe8;
          color: #17603e;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .transform-icon svg {
          width: 24px;
          height: 24px;
        }
        .transform-label {
          font-size: 22px;
          font-weight: 700;
          line-height: 1.18;
        }
        #transform-links {
          display: block;
          width: 800px;
          height: 48px;
        }
        #transform-links path {
          fill: none;
          stroke: #b9c4d6;
          stroke-width: 2;
          stroke-linecap: round;
        }
        #transform-result-wrap {
          display: flex;
          justify-content: center;
        }
        #transform-result {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 66px;
          padding: 0 30px 0 22px;
          border-radius: 33px;
          background: #0f2f1e;
          color: #ffffff;
          font-size: 28px;
          font-weight: 700;
        }
        #transform-result svg {
          width: 28px;
          height: 28px;
        }
      </style>

      <div id="root" data-composition-id="transform" data-width="1080" data-height="1080">
        <div id="transform-panel">
          <div id="transform-kicker">ZAD Train transforms</div>
          <div id="transform-row">
            <div class="transform-chip" id="transform-chip-1">
              <div class="transform-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3" />
                  <circle cx="12" cy="12" r="7" />
                  <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" />
                </svg>
              </div>
              <div class="transform-label">Machine knowledge</div>
            </div>
            <div class="transform-chip" id="transform-chip-2">
              <div class="transform-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                  <path d="M14 3v5h5M9 13h6M9 17h6" />
                </svg>
              </div>
              <div class="transform-label">Technical documentation</div>
            </div>
            <div class="transform-chip" id="transform-chip-3">
              <div class="transform-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9" />
                </svg>
              </div>
              <div class="transform-label">Internal procedures</div>
            </div>
          </div>
          <svg id="transform-links" viewBox="0 0 800 48">
            <path pathLength="1" d="M128.7 0 C128.7 26 400 22 400 48" />
            <path pathLength="1" d="M400 0 L400 48" />
            <path pathLength="1" d="M671.3 0 C671.3 26 400 22 400 48" />
          </svg>
          <div id="transform-result-wrap">
            <div id="transform-result">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l9 5-9 5-9-5z" />
                <path d="M3 13l9 5 9-5" />
              </svg>
              <span>Structured learning content</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        // Local times: chips land as each source is named (12.16s, 13.28s, 14.48s);
        // the result lands on "structured learning content" (16.16s). Host starts at 11.7s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#transform-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
        [0.42, 1.55, 2.75].forEach((t, i) => {
          tl.fromTo(`#transform-chip-${i + 1}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t);
        });
        tl.fromTo("#transform-links path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", stagger: 0.04 }, 4.0);
        tl.fromTo("#transform-result", { opacity: 0, y: 10, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power2.out" }, 4.4);
        tl.to("#transform-panel", { opacity: 0, y: 12, duration: 0.4, ease: "power1.in" }, 7.1);
        window.__timelines["transform"] = tl;
      </script>
    </template>
  </body>
</html>
