<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #closing-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 112px;
          padding: 20px 30px 22px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #closing-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #17603e;
        }
        .closing-line {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-top: 10px;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .closing-check {
          flex: 0 0 34px;
          width: 34px;
          height: 34px;
          border-radius: 17px;
          background: #0f2f1e;
          color: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .closing-check svg {
          width: 20px;
          height: 20px;
        }
      </style>

      <div id="root" data-composition-id="closing" data-width="1080" data-height="1080">
        <div id="closing-panel">
          <div id="closing-kicker">With ZAD Train</div>
          <div class="closing-line" id="closing-line-1">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Turn knowledge into training</span>
          </div>
          <div class="closing-line" id="closing-line-2">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Transfer skills</span>
          </div>
          <div class="closing-line" id="closing-line-3">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Build expertise</span>
          </div>
        </div>
      </div>

      <script>
        // Each line appears on a hand gesture (host starts at 54.2s and holds to the end):
        // pointing sweep 54.8s, hand back to the chin 56.1s, finger raised 57.2s.
        // The lines themselves have no fade or movement; they simply appear.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#closing-panel", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.2);
        [0.6, 1.9, 3.0].forEach((t, i) => {
          tl.set(`#closing-line-${i + 1}`, { opacity: 0 }, 0);
          tl.set(`#closing-line-${i + 1}`, { opacity: 1 }, t);
        });
        window.__timelines["closing"] = tl;
      </script>
    </template>
  </body>
</html>
