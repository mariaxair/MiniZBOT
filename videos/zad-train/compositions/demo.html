<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #demo-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(120% 90% at 50% 30%, #5a6169 0%, #464c54 60%, #3b4047 100%);
          color: #ffffff;
        }
        .demo-head {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 136px;
        }
        .demo-source {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 24px;
          font-weight: 400;
          color: #d5dbe3;
        }
        .demo-source svg {
          width: 22px;
          height: 22px;
          color: #9db8ff;
        }
        .demo-title {
          margin-top: 6px;
          font-size: 44px;
          font-weight: 700;
          letter-spacing: -0.015em;
        }
        #demo-frame {
          position: absolute;
          left: 108px;
          top: 270px;
          width: 864px;
          height: 590px;
          border-radius: 18px;
          overflow: hidden;
          background: #ffffff;
          border: 1px solid rgba(255, 255, 255, 0.18);
          box-shadow: 0 28px 70px rgba(8, 12, 20, 0.45);
        }
        #demo-chrome {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 36px;
          background: #f6f7f9;
          border-bottom: 1px solid #e3e7ee;
          display: flex;
          align-items: center;
          padding-left: 16px;
          gap: 7px;
        }
        .demo-dot {
          width: 10px;
          height: 10px;
          border-radius: 5px;
          background: #d3d9e2;
        }
        #demo-chrome-label {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 14px;
          font-weight: 700;
          color: #6b727e;
          letter-spacing: 0.02em;
        }
        #demo-view {
          position: absolute;
          left: 0;
          right: 0;
          top: 37px;
          bottom: 0;
          overflow: hidden;
        }
        .demo-shot {
          position: absolute;
          inset: 0;
        }
        .demo-zoom {
          position: absolute;
          inset: 0;
        }
        .demo-zoom img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
        }
        #demo-progress {
          position: absolute;
          left: 0;
          right: 0;
          top: 900px;
          display: flex;
          justify-content: center;
          gap: 10px;
        }
        .demo-bar {
          width: 56px;
          height: 6px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.22);
          overflow: hidden;
        }
        .demo-bar-fill {
          width: 100%;
          height: 100%;
          background: #ffffff;
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="demo" data-width="1080" data-height="1080">
        <div id="demo-stage">
          <!-- Narration-matched headers (one per sentence). -->
          <div class="demo-head" id="demo-head-1">
            <div class="demo-source">
              <span>A machine manual</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">A learning module</div>
          </div>
          <div class="demo-head" id="demo-head-2">
            <div class="demo-source">
              <span>A maintenance procedure</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">A step-by-step training</div>
          </div>
          <div class="demo-head" id="demo-head-3">
            <div class="demo-source">
              <span>An internal process</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">Onboarding &amp; skills development</div>
          </div>

          <!-- Product window. Swap the three image files for the real ZAD Train screenshots. -->
          <div id="demo-frame">
            <div id="demo-chrome">
              <div class="demo-dot"></div>
              <div class="demo-dot"></div>
              <div class="demo-dot"></div>
              <div id="demo-chrome-label">ZAD Train</div>
            </div>
            <div id="demo-view">
              <div class="demo-shot" id="demo-shot-1">
                <div class="demo-zoom" id="demo-zoom-1"><img src="assets/demo/screen-1.svg" alt="Machine manual to learning module" /></div>
              </div>
              <div class="demo-shot" id="demo-shot-2">
                <div class="demo-zoom" id="demo-zoom-2"><img src="assets/demo/screen-2.svg" alt="Step-by-step training" /></div>
              </div>
              <div class="demo-shot" id="demo-shot-3">
                <div class="demo-zoom" id="demo-zoom-3"><img src="assets/demo/screen-3.svg" alt="Onboarding and skills path" /></div>
              </div>
            </div>
          </div>

          <div id="demo-progress">
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-1"></div></div>
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-2"></div></div>
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-3"></div></div>
          </div>
        </div>
      </div>

      <script>
        // Host starts at 28.3s. Step boundaries follow the three sentences:
        // 28.43s "A machine manual…", 31.07s "A maintenance procedure…", 34.67s "An internal process…".
        const steps = [
          { start: 0, end: 2.7 },
          { start: 2.7, end: 6.3 },
          { start: 6.3, end: 12 },
        ];
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#demo-stage", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
        tl.fromTo("#demo-frame", { y: 18 }, { y: 0, duration: 0.6, ease: "power2.out" }, 0);

        steps.forEach((s, i) => {
          const n = i + 1;
          const fadeIn = i === 0 ? 0 : 0.45;
          // Screenshot: crossfade in, then a slow push-in for the whole step.
          tl.fromTo(`#demo-shot-${n}`, { opacity: i === 0 ? 1 : 0 }, { opacity: 1, duration: fadeIn || 0.01, ease: "power1.inOut" }, s.start);
          tl.fromTo(`#demo-zoom-${n}`, { scale: 1 }, { scale: 1.06, duration: s.end - s.start + 0.45, ease: "none" }, s.start);
          // Header: soft slide-in, soft exit before the next step.
          tl.fromTo(`#demo-head-${n}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, s.start + (i === 0 ? 0.15 : 0.1));
          if (i < steps.length - 1) {
            tl.to(`#demo-head-${n}`, { opacity: 0, y: -8, duration: 0.25, ease: "power1.in" }, s.end - 0.2);
            tl.to(`#demo-shot-${n}`, { opacity: 0, duration: 0.45, ease: "power1.inOut" }, s.end + 0.01);
          }
          // Progress: fill the active step's bar.
          tl.fromTo(`#demo-fill-${n}`, { scaleX: 0 }, { scaleX: 1, duration: s.end - s.start, ease: "none" }, s.start);
        });

        tl.to("#demo-stage", { opacity: 0, duration: 0.4, ease: "power1.in" }, 11.6);
        window.__timelines["demo"] = tl;
      </script>
    </template>
  </body>
</html>
