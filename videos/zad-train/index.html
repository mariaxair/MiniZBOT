<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>ZAD Train — final edit</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Source footage: full-bleed and untouched. */
      #source {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* Logo sits above every scene, including the demo. */
      #logo {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="58.74"
      data-fps="30"
      data-width="1080"
      data-height="1080"
    >
      <!-- Base: the assembled edit, played as-is (structure, transitions, backgrounds unchanged). -->
      <video
        id="source"
        src="assets/source.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="58.74"
        data-track-index="0"
      ></video>

      <!-- Overlays (track 1). Times follow the narration in transcript.json. -->
      <div
        id="challenge"
        class="scene clip"
        data-composition-id="challenge"
        data-composition-src="compositions/challenge.html"
        data-start="2.9"
        data-duration="5.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="transform"
        class="scene clip"
        data-composition-id="transform"
        data-composition-src="compositions/transform.html"
        data-start="11.7"
        data-duration="7.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="adapted"
        class="scene clip"
        data-composition-id="adapted"
        data-composition-src="compositions/adapted.html"
        data-start="24"
        data-duration="4.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="features"
        class="scene clip"
        data-composition-id="features"
        data-composition-src="compositions/features.html"
        data-start="47.7"
        data-duration="5.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="closing"
        class="scene clip"
        data-composition-id="closing"
        data-composition-src="compositions/closing.html"
        data-start="54.2"
        data-duration="4.54"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>

      <!-- Product demo (track 2): replaces the speaker for the three example sentences. -->
      <div
        id="demo"
        class="scene clip"
        data-composition-id="demo"
        data-composition-src="compositions/demo.html"
        data-start="28.3"
        data-duration="12"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>

      <!-- Brand (track 3): discreet ZAD AI logo, top centre, whole video. -->
      <div
        id="logo"
        class="scene clip"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="58.74"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
