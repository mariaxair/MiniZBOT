<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #adapted-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          bottom: 400px;
          padding: 26px 32px 28px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #adapted-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #17603e;
        }
        #adapted-row {
          display: flex;
          gap: 12px;
          margin-top: 16px;
        }
        .adapted-pill {
          display: flex;
          align-items: center;
          height: 54px;
          padding: 0 22px;
          border-radius: 27px;
          border: 2px solid #d5dce7;
          font-size: 24px;
          font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="adapted" data-width="1080" data-height="1920">
        <div id="adapted-panel">
          <div id="adapted-kicker">Modules adapted to your</div>
          <div id="adapted-row">
            <div class="adapted-pill" id="adapted-pill-1">Equipment</div>
            <div class="adapted-pill" id="adapted-pill-2">Processes</div>
            <div class="adapted-pill" id="adapted-pill-3">Operational needs</div>
          </div>
        </div>
      </div>

      <script>
        // Pills land on "equipment" (25.39s), "process" (26.2s), "operational needs" (27.16s). Host starts at 24s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#adapted-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
        [1.3, 2.1, 3.05].forEach((t, i) => {
          tl.fromTo(`#adapted-pill-${i + 1}`, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, t);
        });
        tl.to("#adapted-panel", { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.3);
        window.__timelines["adapted"] = tl;
      </script>
    </template>
  </body>
</html>
