<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        /* ZAD brand green, matching the logo and the product recordings. */
        #demo-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(110% 80% at 50% 105%, #1c4a33 0%, #0f2f1e 55%, #0a2216 100%);
          color: #ffffff;
        }
        .demo-head {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 520px;
        }
        .demo-source {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 28px;
          font-weight: 400;
          color: #cfe0d6;
        }
        .demo-source svg {
          width: 22px;
          height: 22px;
          color: #8fd3ad;
        }
        .demo-title {
          margin-top: 6px;
          font-size: 52px;
          font-weight: 700;
          letter-spacing: -0.015em;
        }
        #demo-frame {
          position: absolute;
          left: 108px;
          top: 700px;
          width: 864px;
          height: 540px;
          border-radius: 18px;
          overflow: hidden;
          background: #ffffff;
          box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
        }
        #demo-zoom {
          position: absolute;
          inset: 0;
        }
        #demo-video {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #demo-progress {
          position: absolute;
          left: 0;
          right: 0;
          top: 1276px;
          display: flex;
          justify-content: center;
          gap: 10px;
        }
        .demo-bar {
          width: 56px;
          height: 6px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.22);
          overflow: hidden;
        }
        .demo-bar-fill {
          width: 100%;
          height: 100%;
          background: #ffffff;
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="demo" data-width="1080" data-height="1920">
        <div id="demo-stage">
          <!-- Narration-matched headers (one per sentence). -->
          <div class="demo-head" id="demo-head-1">
            <div class="demo-source">
              <span>A machine manual</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">A learning module</div>
          </div>
          <div class="demo-head" id="demo-head-2">
            <div class="demo-source">
              <span>A maintenance procedure</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">A step-by-step training</div>
          </div>
          <div class="demo-head" id="demo-head-3">
            <div class="demo-source">
              <span>An internal process</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </div>
            <div class="demo-title">Onboarding &amp; skills development</div>
          </div>

          <!-- Product recordings, cut to the narration (assets/demo/demo.mp4, see STORYBOARD.md). -->
          <div id="demo-frame">
            <div id="demo-zoom" data-layout-allow-overflow>
              <video id="demo-video" src="assets/demo/demo.mp4" muted playsinline data-start="0" data-duration="12" data-track-index="0"></video>
            </div>
          </div>

          <div id="demo-progress">
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-1"></div></div>
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-2"></div></div>
            <div class="demo-bar"><div class="demo-bar-fill" id="demo-fill-3"></div></div>
          </div>
        </div>
      </div>

      <script>
        // Host starts at 28.3s. Step boundaries follow the three sentences:
        // 28.43s "A machine manual…", 31.07s "A maintenance procedure…", 34.67s "An internal process…".
        // demo.mp4 crossfades between recordings at the same boundaries (2.7s, 6.3s).
        const steps = [
          { start: 0, end: 2.7 },
          { start: 2.7, end: 6.3 },
          { start: 6.3, end: 12 },
        ];
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#demo-stage", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
        tl.fromTo("#demo-frame", { y: 18 }, { y: 0, duration: 0.6, ease: "power2.out" }, 0);
        // One slow, continuous push-in across the whole demo.
        tl.fromTo("#demo-zoom", { scale: 1 }, { scale: 1.04, duration: 12, ease: "none" }, 0);

        steps.forEach((s, i) => {
          const n = i + 1;
          tl.fromTo(`#demo-head-${n}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, s.start + (i === 0 ? 0.15 : 0.1));
          if (i < steps.length - 1) {
            tl.to(`#demo-head-${n}`, { opacity: 0, y: -8, duration: 0.25, ease: "power1.in" }, s.end - 0.2);
          }
          tl.fromTo(`#demo-fill-${n}`, { scaleX: 0 }, { scaleX: 1, duration: s.end - s.start, ease: "none" }, s.start);
        });

        tl.to("#demo-stage", { opacity: 0, duration: 0.4, ease: "power1.in" }, 11.6);
        window.__timelines["demo"] = tl;
      </script>
    </template>
  </body>
</html>
