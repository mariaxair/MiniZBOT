<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #features-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          bottom: 400px;
          padding: 26px 32px 28px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #features-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #17603e;
        }
        #features-row {
          display: flex;
          gap: 14px;
          margin-top: 16px;
        }
        .features-chip {
          flex: 1 1 0;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 78px;
          padding: 0 14px;
          border-radius: 14px;
          background: #f3f5f9;
        }
        .features-icon {
          flex: 0 0 44px;
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: #e3efe8;
          color: #17603e;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .features-icon svg {
          width: 24px;
          height: 24px;
        }
        .features-label {
          font-size: 22px;
          font-weight: 700;
          line-height: 1.18;
        }
      </style>

      <div id="root" data-composition-id="features" data-width="1080" data-height="1920">
        <div id="features-panel">
          <div id="features-kicker">The platform supports</div>
          <div id="features-row">
            <div class="features-chip" id="features-chip-1">
              <div class="features-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
                </svg>
              </div>
              <div class="features-label">Content creation</div>
            </div>
            <div class="features-chip" id="features-chip-2">
              <div class="features-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" />
                  <path d="M8.5 12l2.5 2.5 4.5-5" />
                </svg>
              </div>
              <div class="features-label">Expert validation</div>
            </div>
            <div class="features-chip" id="features-chip-3" style="flex-grow: 1.35">
              <div class="features-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
                  <circle cx="16" cy="6" r="2" />
                  <circle cx="10" cy="12" r="2" />
                  <circle cx="18" cy="18" r="2" />
                </svg>
              </div>
              <div class="features-label">Hard &amp; soft skills adaptation</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        // Chips land on "content creation" (48.58s), "expert validation" (49.94s),
        // "hard and soft skills adaptation" (51.54s). Host starts at 47.7s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#features-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
        [0.85, 2.2, 3.8].forEach((t, i) => {
          tl.fromTo(`#features-chip-${i + 1}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t);
        });
        tl.to("#features-panel", { opacity: 0, y: 12, duration: 0.4, ease: "power1.in" }, 5.4);
        window.__timelines["features"] = tl;
      </script>
    </template>
  </body>
</html>
