<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-400-latin.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        #closing-panel {
          position: absolute;
          left: 108px;
          right: 108px;
          bottom: 400px;
          padding: 26px 32px 28px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22);
          color: #0e1a2b;
        }
        #closing-kicker {
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #17603e;
        }
        .closing-line {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-top: 14px;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .closing-check {
          flex: 0 0 36px;
          width: 36px;
          height: 36px;
          border-radius: 18px;
          background: #0f2f1e;
          color: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .closing-check svg {
          width: 20px;
          height: 20px;
        }
      </style>

      <div id="root" data-composition-id="closing" data-width="1080" data-height="1920">
        <div id="closing-panel">
          <div id="closing-kicker">With ZAD Train</div>
          <div class="closing-line" id="closing-line-1">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Turn knowledge into training</span>
          </div>
          <div class="closing-line" id="closing-line-2">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Transfer skills</span>
          </div>
          <div class="closing-line" id="closing-line-3">
            <div class="closing-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </div>
            <span>Build expertise</span>
          </div>
        </div>
      </div>

      <script>
        // Lines land on "turn knowledge" (54.5s), "transfer skills" (56.09s), "build expertise" (57.28s).
        // Host starts at 54.2s and holds to the end of the video.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#closing-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
        [0.25, 1.85, 3.05].forEach((t, i) => {
          tl.fromTo(`#closing-line-${i + 1}`, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, t);
        });
        window.__timelines["closing"] = tl;
      </script>
    </template>
  </body>
</html>
